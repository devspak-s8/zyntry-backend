[project]
name = "zyntra-backend"
version = "0.1.1"
description = "Zyntra AI Backend Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.14.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.2.0",
    "sentry-sdk>=2.14.0",
    "prometheus-client>=0.20.0",
    "psutil>=6.0.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "openpyxl>=3.1.5",
    "markdown>=3.6",
    "python-multipart>=0.0.18",
    "fastapi-cache2[redis]>=0.1.0",
    "aiomysql>=0.0.23",
    "motor>=3.3.0",
    "libsql-experimental>=0.0.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
