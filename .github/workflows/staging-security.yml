name: Authorized staging security tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-security
  cancel-in-progress: false

jobs:
  two-tenant-isolation:
    name: Two-tenant isolation checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate authorized staging inputs
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_TENANT_A_SESSION: ${{ secrets.STAGING_TENANT_A_SESSION }}
          STAGING_TENANT_B_SESSION: ${{ secrets.STAGING_TENANT_B_SESSION }}
          STAGING_TENANT_A_PROJECT_ID: ${{ secrets.STAGING_TENANT_A_PROJECT_ID }}
          STAGING_TENANT_B_PROJECT_ID: ${{ secrets.STAGING_TENANT_B_PROJECT_ID }}
          STAGING_TENANT_A_RUNTIME_ID: ${{ secrets.STAGING_TENANT_A_RUNTIME_ID }}
          STAGING_TENANT_B_RUNTIME_ID: ${{ secrets.STAGING_TENANT_B_RUNTIME_ID }}
        run: |
          set -euo pipefail
          for name in STAGING_BASE_URL STAGING_TENANT_A_SESSION STAGING_TENANT_B_SESSION \
            STAGING_TENANT_A_PROJECT_ID STAGING_TENANT_B_PROJECT_ID \
            STAGING_TENANT_A_RUNTIME_ID STAGING_TENANT_B_RUNTIME_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required staging environment secret: $name"
              exit 1
            fi
          done
          case "$STAGING_BASE_URL" in
            https://*staging*|https://staging*) ;;
            *) echo "::error::STAGING_BASE_URL must be an HTTPS staging endpoint"; exit 1 ;;
          esac

      - name: Run read-only tenant isolation checks
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_TENANT_A_SESSION: ${{ secrets.STAGING_TENANT_A_SESSION }}
          STAGING_TENANT_B_SESSION: ${{ secrets.STAGING_TENANT_B_SESSION }}
          STAGING_TENANT_A_PROJECT_ID: ${{ secrets.STAGING_TENANT_A_PROJECT_ID }}
          STAGING_TENANT_B_PROJECT_ID: ${{ secrets.STAGING_TENANT_B_PROJECT_ID }}
          STAGING_TENANT_A_RUNTIME_ID: ${{ secrets.STAGING_TENANT_A_RUNTIME_ID }}
          STAGING_TENANT_B_RUNTIME_ID: ${{ secrets.STAGING_TENANT_B_RUNTIME_ID }}
        run: python scripts/security/two_tenant_check.py

  authenticated-zap:
    name: Authenticated OWASP ZAP baseline
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate authorized staging URL and token
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_ZAP_TOKEN: ${{ secrets.STAGING_ZAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_BASE_URL:-}" ] || [ -z "${STAGING_ZAP_TOKEN:-}" ]; then
            echo "::error::STAGING_BASE_URL and STAGING_ZAP_TOKEN are required"
            exit 1
          fi
          case "$STAGING_BASE_URL" in
            https://*staging*|https://staging*) ;;
            *) echo "::error::ZAP target must be an HTTPS staging endpoint"; exit 1 ;;
          esac

      - name: Run authenticated ZAP baseline scan
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_ZAP_TOKEN: ${{ secrets.STAGING_ZAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p zap-results
          ZAP_TARGET_URL="${STAGING_BASE_URL%/}/openapi.json"
          docker run --rm \
            --env ZAP_AUTH_TOKEN="$STAGING_ZAP_TOKEN" \
            --env ZAP_TARGET_URL="$ZAP_TARGET_URL" \
            --volume "$PWD/zap-results:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            sh -c 'zap-api-scan.py \
              -t "$ZAP_TARGET_URL" \
              -f openapi \
              -r zap-report.html \
              -x zap-report.xml \
              -I \
              -z "-config replacer.full_list(0).description=staging-auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer ${ZAP_AUTH_TOKEN}"'

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-staging-report-${{ github.run_id }}
          path: zap-results
          if-no-files-found: ignore
