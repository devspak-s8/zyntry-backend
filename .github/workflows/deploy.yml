name: Build and deploy API

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pytest-mock

      - name: Lint
        # Gate new deployments on parser/runtime-fatal lint errors without
        # making the existing repository-wide style backlog a release blocker.
        run: ruff check app scripts --select E9,F63,F7

      - name: Test
        run: python -m pytest -q

  build:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "uri=ghcr.io/${repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish SHA-pinned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Upload deployment override
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.deploy.yml
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy exact image to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          API_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          COMPOSE_OVERRIDE_FILE: ${{ secrets.COMPOSE_OVERRIDE_FILE }}
          DEPLOY_PUBLIC_API_URL: ${{ github.ref_name == 'main' && 'https://api.zyntry.space' || 'https://staging-api.zyntry.space' }}
          DEPLOY_PUBLIC_FRONTEND_URL: ${{ github.ref_name == 'main' && 'https://zyntry.space' || 'https://staging.zyntry.space' }}
          DEPLOY_OAUTH_GITHUB_CLIENT_ID: ${{ secrets.GITHB_CLIENT_ID }}
          DEPLOY_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.GITHB_CLIENT_SECRET }}
          DEPLOY_OAUTH_NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          DEPLOY_OAUTH_NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          DEPLOY_OAUTH_SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          DEPLOY_OAUTH_SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_IMAGE,DEPLOY_PATH,GHCR_USERNAME,GHCR_READ_TOKEN,COMPOSE_OVERRIDE_FILE,DEPLOY_PUBLIC_API_URL,DEPLOY_PUBLIC_FRONTEND_URL,DEPLOY_OAUTH_GITHUB_CLIENT_ID,DEPLOY_OAUTH_GITHUB_CLIENT_SECRET,DEPLOY_OAUTH_NOTION_CLIENT_ID,DEPLOY_OAUTH_NOTION_CLIENT_SECRET,DEPLOY_OAUTH_SLACK_CLIENT_ID,DEPLOY_OAUTH_SLACK_CLIENT_SECRET
          script: |
            set -eu
            cd "$DEPLOY_PATH"

            if [ -z "${DEPLOY_OAUTH_GITHUB_CLIENT_ID:-}" ] || \
               [ -z "${DEPLOY_OAUTH_GITHUB_CLIENT_SECRET:-}" ] || \
               [ -z "${DEPLOY_OAUTH_NOTION_CLIENT_ID:-}" ] || \
               [ -z "${DEPLOY_OAUTH_NOTION_CLIENT_SECRET:-}" ] || \
               [ -z "${DEPLOY_OAUTH_SLACK_CLIENT_ID:-}" ] || \
               [ -z "${DEPLOY_OAUTH_SLACK_CLIENT_SECRET:-}" ]; then
              echo "OAuth deployment credentials are missing from the selected GitHub environment"
              exit 1
            fi

            export GITHUB_CLIENT_ID="$DEPLOY_OAUTH_GITHUB_CLIENT_ID"
            export GITHUB_CLIENT_SECRET="$DEPLOY_OAUTH_GITHUB_CLIENT_SECRET"
            export NOTION_CLIENT_ID="$DEPLOY_OAUTH_NOTION_CLIENT_ID"
            export NOTION_CLIENT_SECRET="$DEPLOY_OAUTH_NOTION_CLIENT_SECRET"
            export SLACK_CLIENT_ID="$DEPLOY_OAUTH_SLACK_CLIENT_ID"
            export SLACK_CLIENT_SECRET="$DEPLOY_OAUTH_SLACK_CLIENT_SECRET"
            export APP_URL="$DEPLOY_PUBLIC_API_URL"
            export FRONTEND_URL="$DEPLOY_PUBLIC_FRONTEND_URL"

            compose="docker compose -f docker-compose.yml"
            if [ -n "${COMPOSE_OVERRIDE_FILE:-}" ]; then
              compose="$compose -f $COMPOSE_OVERRIDE_FILE"
            fi
            compose="$compose -f docker-compose.deploy.yml"
            current_id=$($compose ps -q api || true)
            previous_image=""
            if [ -n "$current_id" ]; then
              previous_image=$(docker inspect --format '{{.Config.Image}}' "$current_id")
            fi

            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export API_IMAGE
            services="api worker beat runtime-assistant realtime"
            mkdir -p deployment-backups
            backup_file="deployment-backups/pre-pgvector-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            $compose exec -T postgres sh -lc 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' | gzip > "$backup_file"
            test -s "$backup_file"
            find deployment-backups -type f -name 'pre-pgvector-*.sql.gz' -mtime +14 -delete
            $compose pull postgres
            $compose pull $services
            $compose up -d --no-build postgres
            postgres_healthy=false
            for attempt in $(seq 1 30); do
              if $compose exec -T postgres sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
                postgres_healthy=true
                break
              fi
              sleep 2
            done
            if [ "$postgres_healthy" != "true" ]; then
              $compose logs --tail=150 postgres
              exit 1
            fi
            $compose up -d --no-build $services

            $compose exec -T api python -c "from app.core.config import settings; assert all((settings.GITHUB_CLIENT_ID, settings.GITHUB_CLIENT_SECRET, settings.NOTION_CLIENT_ID, settings.NOTION_CLIENT_SECRET, settings.SLACK_CLIENT_ID, settings.SLACK_CLIENT_SECRET)), 'OAuth credentials were not injected into the API container'"
            $compose exec -T api python -c "from app.core.config import settings; assert settings.APP_URL == '$DEPLOY_PUBLIC_API_URL' and settings.FRONTEND_URL == '$DEPLOY_PUBLIC_FRONTEND_URL', 'Public OAuth URLs were not injected into the API container'"

            healthy=false
            for attempt in $(seq 1 30); do
              if $compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"; then
                healthy=true
                break
              fi
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              $compose logs --tail=150 api
              if [ -n "$previous_image" ]; then
                echo "Health check failed; rolling back to $previous_image"
                if echo "$previous_image" | grep -q '^ghcr.io/'; then
                  export API_IMAGE="$previous_image"
                  $compose up -d --no-build $services
                else
                  rollback_compose="docker compose -f docker-compose.yml"
                  if [ -n "${COMPOSE_OVERRIDE_FILE:-}" ]; then
                    rollback_compose="$rollback_compose -f $COMPOSE_OVERRIDE_FILE"
                  fi
                  $rollback_compose up -d --no-build $services
                fi
              fi
              exit 1
            fi

            docker image prune -f
