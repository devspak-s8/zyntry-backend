# Used together with docker-compose.yml on deployed hosts:
# docker compose -f docker-compose.yml -f docker-compose.deploy.yml ...
services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be a SHA-pinned GHCR image}
    pull_policy: always
    environment:
      - EMAIL_ASSET_BASE_URL=${EMAIL_ASSET_BASE_URL:-http://localhost:8000/static/email}
      - APP_URL=${APP_URL:?APP_URL must be configured}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be configured}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - NOTION_CLIENT_ID=${NOTION_CLIENT_ID:-}
      - NOTION_CLIENT_SECRET=${NOTION_CLIENT_SECRET:-}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}

  worker:
    image: ${API_IMAGE:?API_IMAGE must be a SHA-pinned GHCR image}
    pull_policy: always
    environment:
      - EMAIL_ASSET_BASE_URL=${EMAIL_ASSET_BASE_URL:-http://localhost:8000/static/email}

  beat:
    image: ${API_IMAGE:?API_IMAGE must be a SHA-pinned GHCR image}
    pull_policy: always
    environment:
      - EMAIL_ASSET_BASE_URL=${EMAIL_ASSET_BASE_URL:-http://localhost:8000/static/email}

  runtime-assistant:
    image: ${API_IMAGE:?API_IMAGE must be a SHA-pinned GHCR image}
    pull_policy: always
    environment:
      - EMAIL_ASSET_BASE_URL=${EMAIL_ASSET_BASE_URL:-http://localhost:8000/static/email}

  realtime:
    image: ${API_IMAGE:?API_IMAGE must be a SHA-pinned GHCR image}
    pull_policy: always
    environment:
      - EMAIL_ASSET_BASE_URL=${EMAIL_ASSET_BASE_URL:-http://localhost:8000/static/email}
